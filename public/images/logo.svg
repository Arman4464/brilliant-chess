<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cmBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cc352" />
      <stop offset="100%" stop-color="#69923e" />
    </linearGradient>
    <linearGradient id="cmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81b64c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#81b64c" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Sharp Background Container -->
  <rect width="120" height="120" fill="#1e1d1a" />
  <rect x="4" y="4" width="112" height="112" fill="none" stroke="url(#cmBorder)" stroke-width="2" />

  <!-- Base Plinth (Sharp 90 deg corners) -->
  <polygon points="26,98 94,98 94,106 26,106" fill="url(#cmBase)" />
  <polygon points="32,92 88,92 94,98 26,98" fill="#587d32" />

  <!-- Lower Neck & Back Facets -->
  <polygon points="48,72 38,92 58,92 54,70" fill="#4a6a2a" />
  <polygon points="54,70 64,46 68,76 58,92" fill="#587d32" />
  <polygon points="68,76 76,84 88,92 58,92" fill="#3f5a23" />

  <!-- Mane Spikes (Sharp Angular Geometry) -->
  <polygon points="48,16 60,26 52,30 46,42" fill="#a4df5e" />
  <polygon points="60,26 76,34 66,44 52,30" fill="#81b64c" />
  <polygon points="66,44 82,54 72,64 64,46" fill="#69923e" />
  <polygon points="72,64 86,76 76,84 68,76" fill="#587d32" />

  <!-- Face & Snout Facets -->
  <polygon points="48,16 46,42 24,52" fill="#8cc352" />
  <polygon points="46,42 24,52 38,62" fill="#81b64c" />
  <polygon points="24,52 24,62 38,62" fill="#69923e" />
  <polygon points="38,62 48,72 54,70" fill="#587d32" />
  <polygon points="46,42 64,46 54,70 38,62" fill="#75a643" />

  <!-- Sharp Eye Slit (Crisp White Accent) -->
  <polygon points="39,49 46,45 42,52 37,51" fill="#ffffff" />

  <!-- Modern Accent Mark / Geometric Spark at Muzzle -->
  <polygon points="18,52 21,50 20,54" fill="#a4df5e" opacity="0.9" />
</svg>
